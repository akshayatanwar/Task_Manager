<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Tasks</h1>
      <p id="summary">No tasks yet</p>
    </header>

    <form id="form" autocomplete="off">
      <input id="title" type="text" placeholder="What needs doing?" maxlength="120" required aria-label="Task title">
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add task</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button data-filter="all" class="on">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </nav>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here. Add a task above.</p>

    <footer>
      <button id="clear" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
